name = PropertiesConfig

# Global list of appenders
appenders =  file

# --- CONSOLE APPENDER ---
#appender.console.type = Console
#appender.console.name = STDOUT
#appender.console.layout.type = PatternLayout
#appender.console.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

# --- FILE APPENDER ---
# Note: Use 'File' (capital F) for the type
appender.file.type = File
appender.file.name = LOGFILE
appender.file.fileName = Logs/Mylogs.log
appender.file.append = true
appender.file.immediateFlush = true
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = [%-5level] %d{yyyy-MM-dd HH:mm:ss.SSS} [%t] %c{1} - %msg%n

# --- LOGGERS ---
# Link BOTH appenders to the root logger so they both capture events
rootLogger.level = debug
rootLogger.appenderRefs = logfile
rootLogger.appenderRef.logfile.ref = LOGFILE

# Specific logger for your package
logger.dq.name = DeepQLearningInverseKinematics
logger.dq.level = debug
logger.dq.additivity = false
logger.dq.appenderRefs = logfile
logger.dq.appenderRef.logfile.ref = LOGFILE